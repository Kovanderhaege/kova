name: Rust and storage
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=41' 'websockets==17.3'
      - run: python -m unittest discover -s deployment/tests -p 'test_*.py' -v
      - run: python deployment/compliance.py --output dist/server-source
      - uses: actions/upload-artifact@v6
        with:
          name: server-source-and-notices
          path: dist/server-source/
          include-hidden-files: true
          if-no-files-found: error
      - run: python crates/kova-server/tests/distribution.py
      - run: python crates/kova-server/tests/persistence.py
      - run: python crates/kova-server/tests/sessions.py
      - run: python crates/kova-server/tests/communities.py
      - run: python crates/kova-server/tests/chat.py
        env:
          KOVA_TEST_RUST_CLIENT: "1"
      - run: python crates/kova-server/tests/dm.py
        env:
          KOVA_TEST_RUST_CLIENT: "1"
      - run: cargo build -p kova-server --locked
      - run: python crates/kova-server/tests/replication.py
        env:
          KOVA_TEST_RUST_CLIENT: "1"
      - run: python crates/kova-server/tests/revocations.py
      - run: python crates/kova-server/tests/backup_restore.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s deployment/tests -p 'test_*.py' -v
      - run: cargo test -p kova-client-core --locked
      - run: cargo check -p kova-desktop --locked
      - shell: pwsh
        run: ./deployment/tests/package-windows.Tests.ps1
      - shell: pwsh
        run: ./deployment/package-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: windows-development-unsigned
          path: dist/*.zip
          if-no-files-found: error
