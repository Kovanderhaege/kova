name: Rust and storage
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=41'
      - run: python crates/kova-server/tests/persistence.py
      - run: python crates/kova-server/tests/sessions.py
      - run: python crates/kova-server/tests/backup_restore.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kova-client-core --locked
      - run: cargo check -p kova-desktop --locked
      - shell: pwsh
        run: ./deployment/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-spike-unsigned
          path: dist/*.zip
