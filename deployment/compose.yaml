name: kova-dev
services:
  api:
    build: ../backend
    environment:
      PGHOST: db
      PGDATABASE: kova
      PGUSER: kova
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans l'environnement}
      KOVA_ORIGIN: ${KOVA_ORIGIN:-http://127.0.0.1:${KOVA_API_PORT:-8080}}
      KOVA_LISTEN: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${KOVA_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kova
      POSTGRES_USER: kova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans l'environnement}
    ports:
      - "127.0.0.1:${KOVA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kova -d kova"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
