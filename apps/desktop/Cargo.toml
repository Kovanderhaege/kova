[package]
name = "kova-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
unicode-segmentation = "1"
kova-client-core = { path = "../../crates/kova-client-core" }
kova-protocol = { path = "../../crates/kova-protocol" }
kova-identity = { path = "../../crates/kova-identity" }
serde_json = "1"
zeroize = "1"
