[package]
name = "kova-crypto"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
openmls = { version = "=0.8.1", default-features = false, features = ["libcrux-provider"] }
openmls_basic_credential = "=0.5.0"
openmls_libcrux_crypto = "=0.3.1"
tls_codec = { version = "=0.4.2", features = ["derive", "serde", "mls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

